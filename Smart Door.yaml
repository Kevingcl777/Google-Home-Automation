metadata:
  name: "Door & Doorbell Management"
  description: "Independent engines providing specific, isolated phone notifications for jams, extended open locks, and porch deliveries."

automations:
  # ===========================================================================
  # SECTION 1: SPECIFIC MECHANICAL JAM ALERTS
  # ===========================================================================
  - starters:
      - type: device.state.LockUnlock
        device: MudRoom inner door - EntryPoints
        state: isJammed
        is: true
    actions:
      - type: home.command.Notification
        title: "Lock Security Alert"
        body: "The MudRoom inner door is jammed! Please check the deadbolt manually."

  - starters:
      - type: device.state.LockUnlock
        device: SideEntrance door - EntryPoints
        state: isJammed
        is: true
    actions:
      - type: home.command.Notification
        title: "Lock Security Alert"
        body: "The SideEntrance door is jammed! Please check the deadbolt manually."

  - starters:
      - type: device.state.LockUnlock
        device: FrontEntrance Door - EntryPoints
        state: isJammed
        is: true
    actions:
      - type: home.command.Notification
        title: "Lock Security Alert"
        body: "The FrontEntrance Door is jammed! Please check the deadbolt manually."

  # ===========================================================================
  # SECTION 2: SPECIFIC 10-MINUTE UNLOCKED SAFETY REMINDERS
  # ===========================================================================
  - starters:
      - type: device.state.LockUnlock
        device: MudRoom inner door - EntryPoints
        state: isLocked
        is: false
        suppressFor: 10min
    actions:
      - type: time.delay
        for: 10min
      - type: home.command.Notification
        title: "Security Notice"
        body: "The MudRoom inner door has been left unlocked for over 10 minutes."

  - starters:
      - type: device.state.LockUnlock
        device: SideEntrance door - EntryPoints
        state: isLocked
        is: false
        suppressFor: 10min
    actions:
      - type: time.delay
        for: 10min
      - type: home.command.Notification
        title: "Security Notice"
        body: "The SideEntrance door has been left unlocked for over 10 minutes."

  - starters:
      - type: device.state.LockUnlock
        device: FrontEntrance Door - EntryPoints
        state: isLocked
        is: false
        suppressFor: 10min
    actions:
      - type: time.delay
        for: 10min
      - type: home.command.Notification
        title: "Security Notice"
        body: "The FrontEntrance Door has been left unlocked for over 10 minutes."

  # ===========================================================================
  # SECTION 3: CAMERA DOORBELL AUTOMATION
  # ===========================================================================
  - starters:
      # Triggers the instant the Nest camera recognizes a package delivery
      - type: device.event.PackageDelivered
        device: Doorbell - EntryPoints
    actions:
      - type: home.command.Notification
        title: "Package Dropped Off! 📦"
        body: "Your Doorbell spotted a package being delivered to the porch."
